
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Attune v0.5.6</title>
<style>
  :root{
    --gold:#d7b979;
    --gold2:#b78e4f;
    --cream:#eadfce;
    --bg1:#050c15;
    --bg2:#071321;
    --panel:#0a0f16;
    --line:rgba(215,185,121,.36);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(900px 420px at 50% 10%, rgba(37,49,67,.26), transparent 62%),
      linear-gradient(180deg, var(--bg1), var(--bg2) 46%, #06101b 100%);
    color:var(--cream);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  body{overflow-x:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  .page{
    width:min(1500px,100%);
    margin:0 auto;
    padding:30px 28px 34px;
  }
  header{text-align:center}
  h1{
    margin:0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(52px, 6.4vw, 110px);
    font-weight:500;
    letter-spacing:.18em;
    color:#e1c48f;
  }
  .tagline{
    margin-top:8px;
    color:#d3b37a;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:clamp(14px,1.3vw,24px);
  }

  .instrument{
    margin-top:22px;
    display:grid;
    grid-template-columns:minmax(210px,280px) minmax(460px,1fr) minmax(210px,280px);
    gap:22px;
    align-items:center;
  }
  .side{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .side-title{
    color:#ddc28d;
    text-transform:uppercase;
    letter-spacing:.2em;
    font-size:clamp(18px,1.35vw,26px);
    margin-bottom:14px;
  }

  /* --- Eyeball knob --- */
  .knob{
    --size: clamp(150px, 16vw, 220px);
    position:relative;
    width:var(--size);
    height:var(--size);
    border-radius:50%;
    cursor:grab;
    touch-action:none;
  }
  .ticks{
    position:absolute; inset:-14px; border-radius:50%;
    background:repeating-conic-gradient(from -135deg,
      rgba(235,210,156,.95) 0 1.1deg,
      transparent 1.1deg 9deg);
    -webkit-mask:radial-gradient(circle, transparent 77%, #000 78%, #000 80%, transparent 81%);
            mask:radial-gradient(circle, transparent 77%, #000 78%, #000 80%, transparent 81%);
    opacity:.95;
  }
  .bezel{
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 26% 18%, rgba(255,236,190,.18), transparent 18%),
      radial-gradient(circle at 50% 50%, #1b1510 0 61%, #090b10 64%, #8e6930 68%, #20180f 73%, #050709 78%);
    box-shadow:
      0 14px 26px rgba(0,0,0,.44),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(215,185,121,.16);
    border-radius:50%;
  }
  .eye{
    position:absolute; inset:16px; border-radius:50%;
    background:
      radial-gradient(circle at 48% 38%, rgba(255,255,255,.24), transparent 16%),
      radial-gradient(circle at 50% 50%, #fbfbf5 0 46%, #efeee9 47% 57%, #dcdad3 58% 66%, #b2b0ac 67% 69%, #fefef9 70%);
    box-shadow:
      inset 0 0 22px rgba(0,0,0,.16),
      inset 0 0 0 1px rgba(255,255,255,.3);
    overflow:hidden;
  }
  .iris{
    position:absolute;
    width:56%;
    height:56%;
    left:22%;
    top:22%;
    border-radius:50%;
    background:
      radial-gradient(circle at 52% 52%, rgba(255,255,255,.18), transparent 9%),
      radial-gradient(circle at 50% 50%, #6ba0aa 0 18%, #1b5162 35%, #2a7b88 52%, #163946 63%, #0f1b22 72%, transparent 73%),
      conic-gradient(from 0deg, rgba(255,255,255,.08), transparent 12%, rgba(255,255,255,.08) 20%, transparent 30%, rgba(255,255,255,.08) 38%, transparent 48%, rgba(255,255,255,.08) 58%, transparent 68%, rgba(255,255,255,.08) 78%, transparent 88%, rgba(255,255,255,.08) 96%, transparent 100%);
    box-shadow: inset 0 0 18px rgba(0,0,0,.32), 0 0 0 2px rgba(27,31,35,.28);
  }
  .pupil{
    position:absolute;
    width:24%;
    height:24%;
    left:38%;
    top:38%;
    border-radius:50%;
    background: radial-gradient(circle at 42% 36%, rgba(255,255,255,.12), transparent 12%), #050607;
    box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 0 14px rgba(0,0,0,.36);
  }
  .gloss{
    position:absolute;
    width:20%;
    height:20%;
    left:30%;
    top:26%;
    border-radius:50%;
    background: radial-gradient(circle at 36% 36%, rgba(255,255,255,.82), rgba(255,255,255,.20) 30%, transparent 58%);
    filter: blur(.5px);
    opacity:.65;
  }
  .pointer{
    position:absolute;
    left:50%;
    top:16px;
    width:6px;
    height:46px;
    border-radius:6px;
    background:linear-gradient(180deg,#fff3c6,#eac57b 62%, #b1843f);
    box-shadow:0 0 8px rgba(255,219,151,.22);
    transform:translateX(-50%) rotate(0deg);
    transform-origin:50% calc(var(--size) / 2 - 16px);
    z-index:6;
  }

  .freq{
    margin-top:16px;
    color:#e0c089;
    text-align:center;
    line-height:1;
    font-size:clamp(28px,3.1vw,48px);
  }
  .freq small{
    display:block;
    margin-top:8px;
    font-size:.42em;
    color:#c9b08a;
    letter-spacing:.08em;
  }

  .center{text-align:center; min-width:0}
  .fork-wrap{
    width:min(100%, 900px);
    margin:0 auto 8px;
  }
  .fork-svg{
    width:100%;
    display:block;
    height:auto;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.38));
  }
  .ratio{
    margin-top:2px;
    font-size:clamp(44px,4.6vw,74px);
    line-height:1;
    color:#eee2cf;
  }
  .ratio-label{
    margin-top:4px;
    color:#c9ab7a;
    letter-spacing:.13em;
    text-transform:uppercase;
    font-size:clamp(16px,1.45vw,26px);
  }
  .gold-line{
    width:min(560px,78%);
    height:2px;
    margin:18px auto 14px;
    background:linear-gradient(90deg, transparent, rgba(215,185,121,.14), #efc777, rgba(215,185,121,.14), transparent);
    box-shadow:0 0 12px rgba(239,199,119,.25);
  }
  .interval-name{
    color:#e7c36f;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-size:clamp(24px,2.15vw,39px);
  }
  .cents{
    margin-top:5px;
    color:#e0bc71;
    font-size:clamp(17px,1.4vw,25px);
  }

  .controls{
    margin:34px auto 18px;
    width:min(1300px,100%);
    display:grid;
    grid-template-columns:1fr 1fr 84px 1fr 1.1fr;
    gap:14px;
    padding:13px;
    border:1px solid var(--line);
    border-radius:26px;
    background:linear-gradient(180deg, rgba(11,15,22,.82), rgba(7,10,15,.84));
    align-items:center;
  }
  button{
    min-height:74px;
    touch-action:manipulation;
    -webkit-tap-highlight-color:rgba(0,0,0,0);
    border-radius:16px;
    border:1px solid rgba(215,185,121,.38);
    background:linear-gradient(180deg, #0b1119, #070b11);
    color:#e3c585;
    font-size:clamp(14px,1.06vw,19px);
    text-transform:uppercase;
    letter-spacing:.08em;
    cursor:pointer;
  }
  button:hover{filter:brightness(1.06)}
  button:active{transform:translateY(1px)}
  .wave{display:flex; align-items:center; justify-content:center; gap:6px}
  .wave i{display:block; width:3px; border-radius:2px; background:#d4b474}
  .wave i:nth-child(1),.wave i:nth-child(7){height:15px}
  .wave i:nth-child(2),.wave i:nth-child(6){height:31px}
  .wave i:nth-child(3),.wave i:nth-child(5){height:49px}
  .wave i:nth-child(4){height:64px}

  .wells{
    min-height:74px;
    padding:9px 14px;
    border-radius:16px;
    border:1px solid rgba(215,185,121,.38);
    background:linear-gradient(180deg, #0b1119, #070b11);
    text-align:left;
  }
  .wells label{
    display:block;
    color:#dcc9a6;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:13px;
    margin-bottom:6px;
  }
  .wells select{
    width:100%;
    border:0;
    background:transparent;
    color:#eedbc0;
    font-size:21px;
    outline:none;
  }
  .instructions{
    text-align:center;
    color:#e6dccd;
    font-size:clamp(16px,1.38vw,24px);
    line-height:1.42;
    margin:24px auto 18px;
  }

  @media(max-width:900px){
    .instrument{
      grid-template-columns:1fr 1fr;
      gap:26px 10px;
    }
    .center{grid-column:1/-1; grid-row:1}
    .side:first-child{grid-column:1; grid-row:2}
    .side:last-child{grid-column:2; grid-row:2}
    .controls{grid-template-columns:1fr 1fr}
    .wave{display:none}
    .wells{grid-column:1/-1}
  }
  @media(max-width:520px){
    .instrument{grid-template-columns:1fr}
    .center,.side:first-child,.side:last-child{grid-column:1}
    .center{grid-row:1}
    .side:first-child{grid-row:2}
    .side:last-child{grid-row:3}
    .controls{grid-template-columns:1fr}
    .wells{grid-column:auto}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>ATTUNE</h1>
    <div class="tagline">RESONATE • GROUND • CONNECT</div>
    <div id="audioStatus" style="margin-top:10px;font-size:12px;letter-spacing:.08em;color:#bfa77d;opacity:.72">Audio: waiting for first strike</div>
  </header>

  <section class="instrument">
    <div class="side">
      <div class="side-title">Root</div>
      <div class="knob" id="rootKnob">
        <div class="ticks"></div>
        <div class="bezel"></div>
        <div class="eye">
          <div class="iris"></div>
          <div class="pupil"></div>
          <div class="gloss"></div>
        </div>
        <div class="pointer"></div>
      </div>
      <div class="freq" id="rootReadout">256.0<small>Hz</small></div>
    </div>

    <div class="center">
      <div class="fork-wrap">
        <svg class="fork-svg" viewBox="0 0 920 250" xmlns="http://www.w3.org/2000/svg" aria-label="double tuning fork">
          <defs>
            <linearGradient id="steelStroke" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f1f4f7"/>
              <stop offset="23%" stop-color="#c2c8d0"/>
              <stop offset="48%" stop-color="#7c848e"/>
              <stop offset="58%" stop-color="#d8dde3"/>
              <stop offset="100%" stop-color="#9fa7b0"/>
            </linearGradient>
          </defs>

          <!-- Each fork half changes visual length with its selected pitch.
               Lower pitch = longer fork, higher pitch = shorter fork. -->
          <g id="leftForkVisual" fill="none" stroke="url(#steelStroke)" stroke-width="30"
             stroke-linecap="square" stroke-linejoin="round">
            <path d="M60 92 H310 Q360 92 392 126 Q405 140 425 140"/>
            <path d="M60 158 H310 Q360 158 392 124 Q405 110 425 110"/>
          </g>

          <g id="rightForkVisual" fill="none" stroke="url(#steelStroke)" stroke-width="30"
             stroke-linecap="square" stroke-linejoin="round">
            <path d="M860 92 H610 Q560 92 528 126 Q515 140 495 140"/>
            <path d="M860 158 H610 Q560 158 528 124 Q515 110 495 110"/>
          </g>

          <g fill="none" stroke="url(#steelStroke)" stroke-width="30">
            <circle cx="460" cy="125" r="40"/>
          </g>
          <circle cx="460" cy="125" r="26" fill="#101722" stroke="#4e5764" stroke-width="1.4"/>
          <path d="M460 99 A26 26 0 0 1 486 125 H460Z" fill="#707985"/>
          <path d="M434 125 A26 26 0 0 1 460 99 V125Z" fill="#1b222c"/>
          <path d="M460 151 A26 26 0 0 1 434 125 H460Z" fill="#59626e"/>
          <path d="M486 125 A26 26 0 0 1 460 151 V125Z" fill="#0b1017"/>
        </svg>
      </div>

      <div class="ratio" id="ratioReadout">1.500</div>
      <div class="ratio-label">Ratio</div>
      <div class="gold-line"></div>
      <div class="interval-name" id="intervalName">Perfect Fifth</div>
      <div class="cents" id="intervalCents">+0.0 cents</div>
    </div>

    <div class="side">
      <div class="side-title">Harmony</div>
      <div class="knob" id="harmonyKnob">
        <div class="ticks"></div>
        <div class="bezel"></div>
        <div class="eye">
          <div class="iris"></div>
          <div class="pupil"></div>
          <div class="gloss"></div>
        </div>
        <div class="pointer"></div>
      </div>
      <div class="freq" id="harmReadout">384.0<small>Hz</small></div>
    </div>
  </section>

  <div class="instructions">
    Strike the first fork and find a tone that resonates with you.<br>
    Then strike the second fork and explore a harmony that resonates with the first.
  </div>

  <section class="controls">
    <button type="button" id="leftBtn">Strike Left</button>
    <button type="button" id="bothBtn">Strike Both</button>
    <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <button type="button" id="rightBtn">Strike Right</button>
    <div class="wells">
      <label for="wellsSelect">Consonant Wells</label>
      <select id="wellsSelect">
        <option>Free</option>
        <option>Subtle</option>
        <option selected>Guided</option>
        <option>Settled</option>
      </select>
    </div>
  </section>


</div>

<script>
(() => {
  "use strict";

  var ctx = null;
  var rootFreq = 256;
  var ratio = 1.5;
  var duration = 24;
  var leftNode = null;
  var rightNode = null;
  var pendingStrike = false;

  var intervals = [
    ["Unison",1],
    ["Minor Third",6/5],
    ["Major Third",5/4],
    ["Perfect Fourth",4/3],
    ["Perfect Fifth",3/2],
    ["Major Sixth",5/3],
    ["Octave",2]
  ];

  var rootReadout = document.getElementById("rootReadout");
  var harmReadout = document.getElementById("harmReadout");
  var ratioReadout = document.getElementById("ratioReadout");
  var intervalName = document.getElementById("intervalName");
  var intervalCents = document.getElementById("intervalCents");
  var wellsSelect = document.getElementById("wellsSelect");
  var audioStatus = document.getElementById("audioStatus");
  var leftForkVisual = document.getElementById("leftForkVisual");
  var rightForkVisual = document.getElementById("rightForkVisual");

  function setStatus(text) {
    if (audioStatus) audioStatus.textContent = text;
  }

  function getAudioContext() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
      setStatus("Audio unavailable in this browser");
      return null;
    }

    try {
      ctx = new AC();
      ctx.onstatechange = function() {
        setStatus("Audio: " + ctx.state);
      };
      setStatus("Audio: " + ctx.state);
      return ctx;
    } catch (err) {
      setStatus("Audio could not start");
      return null;
    }
  }

  /*
    Mobile Safari/WebKit is strict: resume() must be initiated by a real
    user gesture. We therefore call this directly from pointerdown/touchstart,
    and we only create/start audible oscillators once the context is running.
  */
  function withRunningAudio(callback) {
    var c = getAudioContext();
    if (!c || pendingStrike) return;

    if (c.state === "running") {
      callback(c);
      return;
    }

    pendingStrike = true;
    setStatus("Audio: enabling…");

    var resumeResult;
    try {
      resumeResult = c.resume();
    } catch (err) {
      pendingStrike = false;
      setStatus("Audio blocked — tap Strike again");
      return;
    }

    Promise.resolve(resumeResult).then(function() {
      pendingStrike = false;

      if (c.state === "running") {
        setStatus("Audio: running");
        callback(c);
      } else {
        setStatus("Audio blocked — tap Strike again");
      }
    }).catch(function() {
      pendingStrike = false;
      setStatus("Audio blocked — tap Strike again");
    });
  }

  function makeFork(c, freq, pan) {
    var now = c.currentTime;
    var fundamental = c.createOscillator();
    var partial = c.createOscillator();
    var g1 = c.createGain();
    var g2 = c.createGain();
    var output = c.destination;

    fundamental.type = "sine";
    partial.type = "sine";
    fundamental.frequency.setValueAtTime(freq, now);
    partial.frequency.setValueAtTime(freq * 2.76, now);

    // Gentle attack avoids clicks; nonzero values keep exponential ramps valid.
    g1.gain.setValueAtTime(0.0001, now);
    g1.gain.exponentialRampToValueAtTime(0.46, now + 0.018);
    g1.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    g2.gain.setValueAtTime(0.060, now);
    g2.gain.exponentialRampToValueAtTime(0.00001, now + 0.30);

    if (typeof c.createStereoPanner === "function") {
      var panner = c.createStereoPanner();
      try { panner.pan.setValueAtTime(pan, now); } catch (e) { panner.pan.value = pan; }
      fundamental.connect(g1);
      partial.connect(g2);
      g1.connect(panner);
      g2.connect(panner);
      panner.connect(output);
    } else {
      fundamental.connect(g1);
      partial.connect(g2);
      g1.connect(output);
      g2.connect(output);
    }

    fundamental.start(now);
    partial.start(now);
    fundamental.stop(now + duration + 0.15);
    partial.stop(now + 0.36);

    return {
      fundamental: fundamental,
      partial: partial
    };
  }

  function stopNode(node) {
    if (!node) return;
    try { node.fundamental.stop(); } catch (e) {}
    try { node.partial.stop(); } catch (e) {}
  }

  function strikeLeft() {
    withRunningAudio(function(c) {
      stopNode(leftNode);
      leftNode = makeFork(c, rootFreq, -0.72);
    });
  }

  function strikeRight() {
    withRunningAudio(function(c) {
      stopNode(rightNode);
      rightNode = makeFork(c, rootFreq * ratio, 0.72);
    });
  }

  function strikeBoth() {
    withRunningAudio(function(c) {
      stopNode(leftNode);
      stopNode(rightNode);
      leftNode = makeFork(c, rootFreq, -0.72);
      rightNode = makeFork(c, rootFreq * ratio, 0.72);
    });
  }

  function nearestRatio(r) {
    var best = intervals[0];
    var dist = Infinity;
    var i;

    for (i = 0; i < intervals.length; i++) {
      var d = Math.abs(Math.log(r / intervals[i][1]));
      if (d < dist) {
        dist = d;
        best = intervals[i];
      }
    }

    return { name: best[0], value: best[1], dist: dist };
  }

  function magnetic(raw) {
    var mode = wellsSelect.selectedIndex;
    if (mode === 0) return raw;

    var strength = [0, 0.14, 0.38, 0.66][mode];
    var width = [0, 11, 14, 18][mode];
    var n = nearestRatio(raw);
    var pull = Math.max(0, 1 - n.dist * width);

    return raw + (n.value - raw) * pull * strength;
  }

  function updateForkGeometry() {
    var harmony = rootFreq * ratio;
    var leftScale = Math.max(0.70, Math.min(1.45, Math.sqrt(256 / rootFreq)));
    var rightScale = Math.max(0.70, Math.min(1.45, Math.sqrt(384 / harmony)));

    leftForkVisual.setAttribute(
      "transform",
      "translate(425 0) scale(" + leftScale.toFixed(4) + " 1) translate(-425 0)"
    );

    rightForkVisual.setAttribute(
      "transform",
      "translate(495 0) scale(" + rightScale.toFixed(4) + " 1) translate(-495 0)"
    );
  }

  function updateReadouts() {
    var harmony = rootFreq * ratio;

    rootReadout.innerHTML = rootFreq.toFixed(1) + "<small>Hz</small>";
    harmReadout.innerHTML = harmony.toFixed(1) + "<small>Hz</small>";
    ratioReadout.textContent = ratio.toFixed(3);

    var n = nearestRatio(ratio);
    var cents = 1200 * (Math.log(ratio / n.value) / Math.log(2));

    intervalName.textContent = n.name;
    intervalCents.textContent = (cents >= 0 ? "+" : "") + cents.toFixed(1) + " cents";

    updateForkGeometry();

    if (ctx && ctx.state === "running") {
      var now = ctx.currentTime;

      if (leftNode && leftNode.fundamental) {
        try {
          leftNode.fundamental.frequency.setTargetAtTime(Math.max(20, rootFreq), now, 0.025);
        } catch (e) {}
      }

      if (rightNode && rightNode.fundamental) {
        try {
          rightNode.fundamental.frequency.setTargetAtTime(Math.max(20, harmony), now, 0.025);
        } catch (e) {}
      }
    }
  }

  function bindKnob(id, type) {
    var knob = document.getElementById(id);
    var pointer = knob.querySelector(".pointer");
    var dragging = false;
    var startY = 0;
    var startVal = 0;

    function norm() {
      if (type === "root") return (rootFreq - 64) / (1024 - 64);
      return (ratio - 0.8) / (2.2 - 0.8);
    }

    function visual() {
      var n = Math.max(0, Math.min(1, norm()));
      var deg = -135 + n * 270;
      pointer.style.transform = "translateX(-50%) rotate(" + deg + "deg)";
    }

    function begin(y) {
      dragging = true;
      startY = y;
      startVal = type === "root" ? rootFreq : ratio;
    }

    function move(y) {
      if (!dragging) return;

      var dy = startY - y;

      if (type === "root") {
        rootFreq = Math.max(64, Math.min(1024, startVal + dy * 1.55));
      } else {
        var raw = Math.max(0.8, Math.min(2.2, startVal + dy * 0.0046));
        ratio = magnetic(raw);
      }

      visual();
      updateReadouts();
    }

    function finish() {
      dragging = false;
    }

    if (window.PointerEvent) {
      knob.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        begin(e.clientY);
        try { knob.setPointerCapture(e.pointerId); } catch (err) {}
      }, { passive: false });

      knob.addEventListener("pointermove", function(e) {
        if (!dragging) return;
        e.preventDefault();
        move(e.clientY);
      }, { passive: false });

      knob.addEventListener("pointerup", finish, { passive: true });
      knob.addEventListener("pointercancel", finish, { passive: true });
    } else {
      knob.addEventListener("touchstart", function(e) {
        if (!e.touches.length) return;
        e.preventDefault();
        begin(e.touches[0].clientY);
      }, { passive: false });

      knob.addEventListener("touchmove", function(e) {
        if (!dragging || !e.touches.length) return;
        e.preventDefault();
        move(e.touches[0].clientY);
      }, { passive: false });

      knob.addEventListener("touchend", finish, { passive: true });
      knob.addEventListener("touchcancel", finish, { passive: true });
    }

    visual();
  }

  function bindStrikeButton(button, action) {
    var fired = false;

    function fire(e) {
      if (e) e.preventDefault();

      // Prevent pointerdown + synthetic click from striking twice.
      if (fired) return;
      fired = true;
      action();

      setTimeout(function() { fired = false; }, 180);
    }

    if (window.PointerEvent) {
      button.addEventListener("pointerdown", fire, { passive: false });
    } else {
      button.addEventListener("touchstart", fire, { passive: false });
      button.addEventListener("click", fire, { passive: false });
    }
  }

  bindKnob("rootKnob", "root");
  bindKnob("harmonyKnob", "harmony");

  bindStrikeButton(document.getElementById("leftBtn"), strikeLeft);
  bindStrikeButton(document.getElementById("bothBtn"), strikeBoth);
  bindStrikeButton(document.getElementById("rightBtn"), strikeRight);

  wellsSelect.addEventListener("change", function() {
    ratio = magnetic(ratio);
    updateReadouts();
  });

  // If iOS suspends audio when the tab/background changes, the next strike
  // will resume it through withRunningAudio().
  window.addEventListener("pageshow", function() {
    if (ctx) setStatus("Audio: " + ctx.state);
  });

  updateReadouts();
})();
</script>
